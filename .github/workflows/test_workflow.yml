name: Build and Run C Program

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: build with make
        run: make

      - name: run the binary
        run: make run

      - name: run tests
        run: make test

      - name: cleanup
        run: make clean
